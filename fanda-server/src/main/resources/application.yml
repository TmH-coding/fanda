server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fanda?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:tmh123}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:fanda-secret-key-change-this-in-production-256bit}
  access-expiration: 7200000
  refresh-expiration: 604800000

logging:
  level:
    com.fanda: DEBUG
