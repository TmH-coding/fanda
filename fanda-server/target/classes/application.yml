server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fanda?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:tmh123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:fanda-secret-key-change-this-in-production-256bit}
  access-expiration: 7200000
  refresh-expiration: 604800000

logging:
  level:
    com.fanda: DEBUG
